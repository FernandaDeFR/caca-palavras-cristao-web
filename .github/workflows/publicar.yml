name: Publicar jogo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      - run: flutter build web --release --base-href /caca-palavras-cristao-web/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4